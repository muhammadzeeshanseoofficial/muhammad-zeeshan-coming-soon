<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Muhammad Zeeshan — something new is on the way.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://muhammad-zeeshan.com/">
  <title>Muhammad Zeeshan — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #f4f0e8;
      --muted: rgba(244, 240, 232, 0.72);
      --line: rgba(244, 240, 232, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--text);
      font-family: "Outfit", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(196, 149, 92, 0.28), transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 90%, rgba(72, 96, 140, 0.35), transparent 50%),
        linear-gradient(160deg, #14101a 0%, #1c2438 48%, #0f141f 100%);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n' x='0' y='0'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      opacity: 0.07;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(640px, calc(100% - 48px));
      text-align: center;
      padding: 4rem 1.5rem;
    }

    .eyebrow {
      display: inline-block;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.6rem, 8vw, 4.6rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }

    .rule {
      width: 64px;
      height: 1px;
      margin: 0 auto 1.5rem;
      background: var(--line);
    }

    .soon {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.35rem, 3.2vw, 1.8rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #e8d5b5;
      margin-bottom: 1.25rem;
    }

    p {
      font-size: 1.05rem;
      font-weight: 300;
      line-height: 1.7;
      color: var(--muted);
      max-width: 28rem;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Official site</div>
    <h1>Muhammad Zeeshan</h1>
    <div class="rule" aria-hidden="true"></div>
    <div class="soon">Coming Soon</div>
    <p>A new home for work, ideas, and what’s next. Thank you for stopping by — this page will be live shortly.</p>
  </main>
</body>
</html>
